<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar perfil | Leonor Armando</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="bg"><div class="wrap"><div class="top"><div><h1 class="h1">Editar perfil</h1><p class="muted">Atualize as suas informações.</p></div><a href="{{url_for('dashboard')}}">Voltar</a></div><div class="card">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><div class="grid"><div class="field"><label>Nome completo</label><input name="full_name" value="{{user.full_name}}" required></div><div class="field"><label>Data de nascimento</label><input type="date" name="birth_date" value="{{user.birth_date}}"></div><div class="field"><label>Contacto</label><input name="phone" value="{{user.phone}}"></div><div class="field"><label>Profissão</label><input name="profession" value="{{user.profession}}"></div></div><div class="field"><label>Biografia / informações adicionais</label><textarea name="bio" rows="7">{{user.bio}}</textarea></div><button class="btn">Guardar alterações</button></form></div></div></div></body></html>
