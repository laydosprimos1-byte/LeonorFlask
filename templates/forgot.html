<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar | Leonor Armando</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="bg"><div class="wrap"><div class="card auth"><div class="brand">LA • PERFIL</div><h1 class="h1">Recuperar conta</h1><p class="muted">Informe o email da sua conta.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>Email</label><input type="email" name="email" required></div><button class="btn">Gerar recuperação</button></form><div class="links"><a href="{{url_for('login')}}">Voltar ao login</a></div></div></div></div></body></html>
