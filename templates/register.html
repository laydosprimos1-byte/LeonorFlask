<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Leonor Armando</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="bg"><div class="wrap"><div class="card auth"><div class="brand">LA • PERFIL</div><h1 class="h1">Criar conta</h1><p class="muted">Preencha os seus dados.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>Nome completo</label><input name="full_name" value="Leonor Armando Maquina" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Senha</label><input type="password" name="password" minlength="6" required></div><div class="field"><label>Data de nascimento</label><input type="date" name="birth_date" value="1994-12-30"></div><div class="field"><label>Contacto</label><input name="phone" value="864457008"></div><div class="field"><label>Profissão</label><input name="profession" placeholder="Digite a sua profissão"></div><div class="field"><label>Biografia / informações</label><textarea name="bio" rows="4" placeholder="Escreva uma breve informação sobre si..."></textarea></div><button class="btn">Criar conta</button></form><div class="links"><a href="{{url_for('login')}}">Já tenho conta</a></div></div></div></div></body></html>
