<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Leonor Armando</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="bg"><div class="wrap"><div class="card auth"><div class="brand">LA • PERFIL</div><h1 class="h1">Bem-vindo</h1><p class="muted">Entre na sua conta para acessar o seu perfil.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>Email</label><input type="email" name="email" placeholder="seu@email.com" required></div><div class="field"><label>Senha</label><input type="password" name="password" placeholder="••••••••" required></div><button class="btn">Entrar</button></form><div class="links"><a href="{{url_for('forgot')}}">Esqueceu a senha?</a><a href="{{url_for('register')}}">Criar conta</a></div></div></div></div></body></html>
